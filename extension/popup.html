<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Allow Copy</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f9fafc; --ink: #14171f; --muted: #667085; --line: #e3e6ee;
  --accent: #3a6df0; --off: #c3c9d6; --sel: #bcd1ff; --gold: #946200;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161c; --ink: #eceff6; --muted: #98a1b3; --line: #2a2e39; --accent: #6f95ff; --off: #444a59; --sel: #2f4b91; --gold: #f2b83a; }
}
* { box-sizing: border-box; }
body { margin: 0; width: 300px; background: var(--bg); color: var(--ink);
  font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
main { padding: 14px 16px 12px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
header img { flex: none; width: 52px; height: 52px; border-radius: 11px; }
h1 { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.2; }
.by { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.by b { color: var(--gold); font-weight: 650; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.title { display: block; font-weight: 550; }
.hint { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.host { background: var(--sel); border-radius: 2px; padding: 0 3px; font-weight: 600; word-break: break-all; }
.sw { appearance: none; -webkit-appearance: none; flex: none; position: relative; margin: 0;
  width: 38px; height: 22px; border-radius: 11px; background: var(--off); cursor: pointer; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; transition: transform .15s; }
.sw:checked { background: var(--accent); }
.sw:checked::after { transform: translateX(16px); }
.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw:disabled { opacity: .45; cursor: not-allowed; }
kbd { padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); font-size: 11px; font-weight: 600; white-space: nowrap; }
.static { cursor: default; }
.btn { flex: none; font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { margin: 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/128.png" alt="JKING logo">
    <div><h1>Free Allow Copy</h1><p class="by">Made by <b>jalavya</b></p></div>
  </header>
  <label class="row">
    <span><span class="title">Unlock <span class="host" id="host">this page</span></span>
    <span class="hint" id="siteHint"></span></span>
    <input type="checkbox" role="switch" class="sw" id="site">
  </label>
  <label class="row">
    <span><span class="title">Unlock every site</span>
    <span class="hint">A choice for one site overrides this.</span></span>
    <input type="checkbox" role="switch" class="sw" id="all">
  </label>
  <div class="row static">
    <span><span class="title">Paste where Ctrl+V is blocked</span>
    <span class="hint" id="pasteHint">Click into the field, then press <kbd>Alt+Shift+V</kbd></span></span>
    <button type="button" class="btn" id="change">Change</button>
  </div>
  <p class="foot">After installing, reload tabs that were already open.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
